name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  configuration:
    name: Detect optional integration configuration
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.detect.outputs.visual }}
      database: ${{ steps.detect.outputs.database }}
      database-private: ${{ steps.detect.outputs.database-private }}
    steps:
      - name: Detect configured integrations
        id: detect
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SUPABASE_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$TEST_USER_EMAIL" ] && [ -n "$TEST_USER_PASSWORD" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo 'visual=true' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$DATABASE_URL" ]; then
            echo 'database=true' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo 'database-private=true' >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: configuration
    name: Lint, typecheck, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test and coverage
        run: npm run test:coverage

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check and test C&I Edge Function
        working-directory: supabase/functions
        run: |
          deno check calculate-commercial-industrial/index.ts
          deno test --allow-env calculate-commercial-industrial/index.test.ts

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Playwright browser
        if: ${{ needs.configuration.outputs.visual == 'true' }}
        run: npx playwright install --with-deps chromium

      # Build even without integration credentials; these placeholders are only used in CI.
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-build.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-build-placeholder' }}

      - name: Visual Tests
        if: ${{ needs.configuration.outputs.visual == 'true' }}
        run: npm run test:visual
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload visual test artifacts
        if: ${{ failure() && needs.configuration.outputs.visual == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Database migrations and RLS tests
    # Secrets are unavailable to pull requests from forks. The application
    # checks above remain required there; this job runs whenever the repository
    # has a configured database URL secret.
    needs: configuration
    if: ${{ needs.configuration.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check migration drift
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Run pgTAP ownership and RLS tests
        run: supabase test db --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  database-private:
    name: Private database migrations and RLS tests
    # Use this job when Postgres is reachable only through the application
    # host's private network. It is intentionally separate from the public URL
    # job so either deployment model can be enabled independently.
    needs: configuration
    if: ${{ needs.configuration.outputs.database-private == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUPABASE_SSH_PRIVATE_KEY }}

      - name: Open private database tunnel
        env:
          SUPABASE_SSH_HOST: ${{ secrets.SUPABASE_SSH_HOST }}
          SUPABASE_TUNNEL_REMOTE: ${{ secrets.SUPABASE_TUNNEL_REMOTE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SSH_HOST"
          test -n "$SUPABASE_TUNNEL_REMOTE"
          ssh -o StrictHostKeyChecking=accept-new -N -L 5432:"$SUPABASE_TUNNEL_REMOTE":5432 "$SUPABASE_SSH_HOST" &
          echo $! > "$RUNNER_TEMP/supabase-tunnel.pid"
          for attempt in $(seq 1 20); do
            (echo >/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo 'O túnel SSH não ficou disponível.' >&2
          exit 1

      - name: Check migrations and run pgTAP
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRIVATE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          supabase test db --db-url "$SUPABASE_DB_URL"

      - name: Close private database tunnel
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/supabase-tunnel.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/supabase-tunnel.pid")" || true
          fi
